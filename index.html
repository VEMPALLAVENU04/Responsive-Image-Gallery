<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Responsive Image Gallery</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<h1>Responsive Image Gallery</h1>

<div class="buttons">

<button class="active" data-filter="all">All</button>
<button data-filter="nature">Nature</button>
<button data-filter="city">City</button>
<button data-filter="animals">Animals</button>

</div>


<div class="gallery">

<div class="image nature">
<img src="images/nature1.jpg" alt="">
</div>

<div class="image nature">
<img src="images/nature2.jpg" alt="">
</div>

<div class="image city">
<img src="images/city1.jpg" alt="">
</div>

<div class="image city">
<img src="images/city2.jpg" alt="">
</div>

<div class="image animals">
<img src="images/animal1.jpg" alt="">
</div>

<div class="image animals">
<img src="images/animal2.jpg" alt="">
</div>

</div>


<!-- Lightbox -->

<div class="lightbox">

<span class="close">&times;</span>

<button class="prev">&#10094;</button>

<img class="lightbox-img">

<button class="next">&#10095;</button>

</div>

<script src="script.js"></script>

</body>
</html>
